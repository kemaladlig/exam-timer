
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Düz Siyah / Koyu Arka Plan -->
  <rect width="512" height="512" fill="#0A0A0C"/>

  <defs>
    <linearGradient id="blueGradient" x1="256" y1="120" x2="410" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="whiteSolid" x1="256" y1="120" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Üst Tepe Butonu (Kalın, oturaklı, ergonomik) -->
  <rect x="226" y="86" width="60" height="24" rx="10" fill="#FFFFFF"/>
  <rect x="244" y="110" width="24" height="24" rx="4" fill="#94A3B8"/>

  <!-- Sağ Yan Buton (45 derece, belirgin ve kalın) -->
  <g transform="rotate(45 375 165)">
    <rect x="354" y="150" width="42" height="20" rx="8" fill="#FFFFFF"/>
    <rect x="366" y="170" width="18" height="16" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Ana Kronometre Gövdesi (28px kalın, güçlü ve tok çember) -->
  <circle cx="256" cy="275" r="140" stroke="url(#whiteSolid)" stroke-width="28" stroke-linecap="round"/>

  <!-- Aktif Geri Sayım / Odak Yayı (Elektrik Mavisi 28px kalın yay) -->
  <path d="M 256 135 A 140 140 0 0 1 396 275" stroke="url(#blueGradient)" stroke-width="28" stroke-linecap="round"/>

  <!-- İç Kadran Noktaları (Kalın & Dengeli) -->
  <circle cx="256" cy="180" r="7" fill="#38BDF8"/>
  <circle cx="351" cy="275" r="7" fill="#64748B"/>
  <circle cx="256" cy="370" r="7" fill="#64748B"/>
  <circle cx="161" cy="275" r="7" fill="#64748B"/>

  <!-- Güçlü & Kalın İbre (11 yönüne doğru, sınav odağı) -->
  <line x1="256" y1="275" x2="202" y2="185" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <circle cx="198" cy="178" r="9" fill="#38BDF8"/>

  <!-- Orta Göbek (Sağlam, oturaklı çift halka) -->
  <circle cx="256" cy="275" r="30" fill="#0A0A0C" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="256" cy="275" r="14" fill="#38BDF8"/>
</svg>
