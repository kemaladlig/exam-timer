<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Navy Gradient Background (Full Bleed) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>

    <!-- Electric Cyan Glowing Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Subtle Glow for Progress Arc -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Stopwatch Group -->
  <g transform="translate(0, 10)">
    <!-- Top Crown -->
    <rect x="226" y="78" width="60" height="34" rx="8" fill="#ffffff"/>
    <rect x="210" y="64" width="92" height="18" rx="7" fill="#ffffff"/>

    <!-- Top Right Lap Button -->
    <rect x="366" y="112" width="38" height="22" rx="7" fill="#ffffff" transform="rotate(45 366 112)"/>

    <!-- Stopwatch Outer Ring -->
    <circle cx="256" cy="276" r="162" stroke="#ffffff" stroke-width="26"/>

    <!-- Inner Glowing Electric Cyan Progress Ring (3/4 circle) -->
    <circle cx="256" cy="276" r="116" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="540 200" transform="rotate(-90 256 276)" filter="url(#neonGlow)"/>

    <!-- Center Clock Hands (10:10 Focus Angle) -->
    <circle cx="256" cy="276" r="14" fill="#ffffff"/>
    
    <!-- Hour Hand (Pointing at ~10 o'clock) -->
    <line x1="256" y1="276" x2="198" y2="218" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

    <!-- Minute Hand (Pointing at ~2 o'clock) -->
    <line x1="256" y1="276" x2="332" y2="200" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>